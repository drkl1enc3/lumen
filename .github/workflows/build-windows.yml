name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Windows runtime tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "src-tauri/resources/windows/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$bin/yt-dlp.exe"

          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -LiteralPath "ffmpeg.zip" -DestinationPath "ffmpeg" -Force
          $ffmpeg = Get-ChildItem "ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem "ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "$bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "$bin/ffprobe.exe"

          choco install mpv -y --no-progress
          $mpv = (Get-Command mpv.exe -ErrorAction SilentlyContinue).Source
          if (-not $mpv) {
            $mpv = (Get-ChildItem "C:\ProgramData\chocolatey\lib\mpv" -Recurse -Filter "mpv.exe" | Select-Object -First 1).FullName
          }
          if (-not $mpv) { throw "mpv.exe not found" }
          Copy-Item $mpv "$bin/mpv.exe"

          Get-ChildItem $bin | Format-Table Name,Length

      - name: Build Windows app and NSIS installer
        run: npm run tauri build -- --bundles nsis
        env:
          CI: true

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "portable" | Out-Null
          Copy-Item "src-tauri/target/release/lumen.exe" "portable/Lumen.exe"
          Copy-Item -Recurse "src-tauri/resources/windows/bin" "portable/bin"
          Compress-Archive -Path "portable/*" -DestinationPath "Lumen_0.1.0_x64-portable.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Lumen_0.1.0_x64-portable.zip
