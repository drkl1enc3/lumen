[package]
name = "lumen"
version = "0.1.0"
description = "Lumen — free music player"
authors = ["Lumen"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
libc = "0.2"
